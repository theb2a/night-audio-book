<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Le Grand Livre des Histoires du Soir — Tome 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#1a1147;
    --night-2:#2a1f6b;
    --night-3:#3b2c8f;
    --lamp:#ffd27a;
    --lamp-soft:#ffe9c2;
    --page:#fff7ea;
    --ink:#3a2e4f;
    --ink-soft:#6b5f7d;
    --diamond:#5be0d8;
    --heart:#ff7a9c;
    --cat-hero:#ff8a3d;
    --cat-fun:#ffcf3d;
    --cat-manners:#5bd0e8;
    --cat-family:#ff7a9c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Baloo 2','Fredoka','Trebuchet MS',sans-serif;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,210,122,.18), transparent 40%),
      radial-gradient(circle at 82% 85%, rgba(91,224,216,.14), transparent 45%),
      linear-gradient(160deg,var(--night-1),var(--night-2) 55%,var(--night-3));
    color:var(--page);
    min-height:100%;
    overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:14px;
  }
  .svg-defs{position:absolute;width:0;height:0;overflow:hidden;}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star-dot{position:absolute;background:#fff;border-radius:50%;opacity:.8;
    animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}

  .wrap{position:relative;z-index:2;width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center;}

  header.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .moon{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff6da,#ffd27a);
    box-shadow:0 0 16px rgba(255,210,122,.7);}
  .brand b{font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;}
  .home-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    color:var(--page);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
    padding:8px 14px;border-radius:14px;cursor:pointer;backdrop-filter:blur(4px);transition:.2s;}
  .home-btn:hover{background:rgba(255,255,255,.22);}
  .home-btn:active{transform:scale(.96);}

  /* === LIVRE === */
  .book{position:relative;width:100%;aspect-ratio:3/4.1;max-height:76vh;perspective:1800px;}
  .page{
    position:absolute;inset:0;background:linear-gradient(160deg,var(--page),#fdeccf);
    border-radius:22px;
    box-shadow:0 18px 40px rgba(10,6,40,.55), inset 0 0 0 6px rgba(255,255,255,.5),
      inset 6px 0 22px rgba(0,0,0,.06);
    color:var(--ink);
    padding:18px 18px 14px;
    display:flex;flex-direction:column;
    transform-origin:left center;
    backface-visibility:hidden;
    overflow:hidden;
  }
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;
    background:linear-gradient(90deg,rgba(0,0,0,.10),transparent);border-radius:22px 0 0 22px;}
  .page.flip-out{animation:flipOut .34s ease-in forwards;}
  .page.flip-in{animation:flipIn .34s ease-out forwards;}
  @keyframes flipOut{from{transform:rotateY(0);opacity:1}to{transform:rotateY(-95deg);opacity:.25}}
  @keyframes flipIn{from{transform:rotateY(95deg);opacity:.25}to{transform:rotateY(0);opacity:1}}

  .cat-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;color:#fff;padding:5px 12px;border-radius:999px;margin-bottom:4px;}
  .story-no{position:absolute;top:16px;right:18px;font-family:'Press Start 2P',monospace;
    font-size:10px;color:var(--ink-soft);opacity:.8;}
  .page h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(19px,5vw,25px);
    line-height:1.1;margin:2px 0 8px;color:var(--ink);}

  /* === DÉROULÉ ILLUSTRÉ : une image avant chaque moment du récit === */
  .story-scroll{flex:1;overflow-y:auto;padding-right:6px;scrollbar-width:thin;}
  .story-scroll::-webkit-scrollbar{width:8px;}
  .story-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px;}
  .panel{margin:0 0 16px;}
  .panel:last-child{margin-bottom:4px;}
  /* l'image occupe toute la largeur du panneau : même rapport que le viewBox 320x180 */
  .pillus{width:100%;aspect-ratio:320/180;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#fffdf8,#f6ead4);
    border:1px solid rgba(120,90,40,.14);border-radius:16px;overflow:hidden;
    box-shadow:0 5px 14px rgba(90,60,20,.13);margin-bottom:9px;}
  .pillus svg{width:100%;height:100%;display:block;}
  .step{display:inline-flex;align-items:center;gap:6px;font-family:'Press Start 2P',monospace;
    font-size:8px;color:var(--ink-soft);opacity:.75;margin-bottom:5px;letter-spacing:.5px;}
  .step .dot{width:7px;height:7px;border-radius:50%;}
  .panel p{margin:0;font-size:clamp(15px,3.8vw,17px);line-height:1.52;color:#4a3d5c;}

  /* COUVERTURE */
  .cover{align-items:center;justify-content:center;text-align:center;gap:4px;
    background:
      radial-gradient(circle at 50% 24%, rgba(255,210,122,.45), transparent 55%),
      linear-gradient(165deg,#2a1f6b,#1a1147);
    color:var(--page);}
  .cover::before{display:none;}
  .cover .eyebrow{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;color:var(--lamp);}
  .cover h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(25px,6.6vw,38px);
    line-height:1.05;margin:6px 14px 4px;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  .cover .sub{font-size:15px;color:var(--lamp-soft);margin-bottom:6px;padding:0 10px;}
  .cover .cover-art{width:100%;height:34%;min-height:130px;display:flex;align-items:center;justify-content:center;}
  .cover .cover-art svg{width:100%;height:100%;}
  .cover .start{margin-top:12px;background:linear-gradient(180deg,#ff9d4d,#ff7a3d);
    color:#fff;border:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;
    padding:13px 30px;border-radius:18px;cursor:pointer;box-shadow:0 8px 0 #c9531f,0 14px 24px rgba(0,0,0,.4);
    transition:.12s;}
  .cover .start:active{transform:translateY(5px);box-shadow:0 3px 0 #c9531f;}
  .cover .pour{margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.72);}

  /* SOMMAIRE */
  .menu{position:relative;z-index:2;width:100%;max-width:580px;display:none;flex-direction:column;gap:14px;}
  .menu.show{display:flex;}
  .menu h3{font-family:'Fredoka',sans-serif;font-weight:700;font-size:17px;margin:4px 2px;
    display:flex;align-items:center;gap:8px;color:#fff;}
  .menu h3 .pip{width:12px;height:12px;border-radius:4px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .scard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:.15s;backdrop-filter:blur(3px);}
  .scard:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
  .scard:active{transform:scale(.97);}
  .scard .nn{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--lamp);}
  .scard .tt{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;line-height:1.15;color:#fff;}

  /* NAV */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:14px;}
  .nbtn{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(180deg,#6a4fd0,#4a34a8);color:#fff;font-size:26px;font-weight:700;
    box-shadow:0 6px 0 #2e1f74,0 10px 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
    transition:.12s;}
  .nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e1f74;}
  .nbtn:disabled{opacity:.35;box-shadow:0 6px 0 #2e1f74;cursor:default;}
  .progress{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;}
  .pcount{font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;color:var(--lamp-soft);}
  .pbar{width:100%;height:9px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,var(--lamp),#ff8a3d);border-radius:999px;transition:width .35s ease;}
  .hint{margin-top:10px;font-size:12px;color:rgba(255,255,255,.55);text-align:center;}

  /* lecture à voix haute */
  .speak-ctl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex:0 0 auto;flex-wrap:wrap;}
  .speak-btn{background:linear-gradient(180deg,#ffd27a,#ffba4a);color:#5a3b12;border:none;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;
    padding:10px 18px;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 0 #c98a2a,0 8px 14px rgba(0,0,0,.18);transition:.12s;}
  .speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c98a2a;}
  .speak-btn.s-pause{background:linear-gradient(180deg,#9be7a0,#5fcf6a);color:#0f481b;box-shadow:0 4px 0 #2f8a3a;}
  .speak-btn.s-pause:active{box-shadow:0 1px 0 #2f8a3a;}
  .speak-btn.s-stop{background:linear-gradient(180deg,#ff9d9d,#ff6b6b);color:#fff;box-shadow:0 4px 0 #c93a3a;padding:10px 14px;}
  .speak-btn.s-stop:active{box-shadow:0 1px 0 #c93a3a;}
  .speak-btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px;}
  .audio-progress{width:100%;display:none;flex-direction:column;align-items:center;gap:4px;margin-top:8px;}
  .audio-progress .alabel{font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;color:var(--lamp-soft);letter-spacing:.3px;}
  .abar{width:100%;height:7px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}
  .afill{height:100%;width:0%;background:linear-gradient(90deg,var(--diamond),#3ec8c0);border-radius:999px;transition:width .25s linear;}

  /* ANIMATIONS ILLUSTRATIONS */
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px)}60%{transform:translateY(-6px)}}
  @keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}60%{transform:scale(1.04)}}
  @keyframes halo{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .a-float{animation:float 3s ease-in-out infinite;transform-origin:center;}
  .a-bob{animation:bob 2.4s ease-in-out infinite;transform-origin:center bottom;}
  .a-pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;}
  .a-spin{animation:spin 9s linear infinite;transform-origin:center;}
  .a-spark{animation:spark 1.6s ease-in-out infinite;transform-origin:center;}
  .a-sway{animation:sway 3s ease-in-out infinite;transform-origin:center top;}
  .a-bounce{animation:bounce 1.7s ease-in-out infinite;transform-origin:center bottom;}
  .a-drift{animation:drift 7s ease-in-out infinite alternate;}
  .a-beat{animation:beat 1.8s ease-in-out infinite;transform-origin:center;}
  /* halo : ne touche pas a l'opacite, contrairement a .a-pulse */
  .a-halo{animation:halo 2.4s ease-in-out infinite;transform-origin:center;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;}
    .star-dot{display:none;}
  }
  .nbtn:focus-visible,.home-btn:focus-visible,.scard:focus-visible,.start:focus-visible{outline:3px solid var(--lamp);outline-offset:3px;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- dégradés partagés par toutes les illustrations (définis une seule fois, ids uniques) -->
<svg class="svg-defs" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141046"/><stop offset="1" stop-color="#4a2f88"/></linearGradient>
  <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8f0"/><stop offset="1" stop-color="#dff2ff"/></linearGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2c8f"/><stop offset=".55" stop-color="#a35a9a"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
  <linearGradient id="gRoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c9"/><stop offset="1" stop-color="#f6cf9d"/></linearGradient>
  <linearGradient id="gHosp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf8f5"/><stop offset="1" stop-color="#c9e7e2"/></linearGradient>
  <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ecb4e"/><stop offset="1" stop-color="#47822a"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf9455"/><stop offset="1" stop-color="#9c6330"/></linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63c8e8"/><stop offset="1" stop-color="#2b7fb8"/></linearGradient>
  <linearGradient id="gSnow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#cfe4f2"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#fff3cf" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gDome"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#bfe6ea" stop-opacity=".28"/></radialGradient>
</defs></svg>

<!-- VUE LIVRE -->
<div class="wrap" id="bookView">
  <header class="topbar">
    <div class="brand"><span class="moon"></span><b>Histoires du Soir · T3</b></div>
    <button type="button" class="home-btn" id="menuBtn">📖 Sommaire</button>
  </header>

  <div class="book" id="book">
    <div class="page" id="page"></div>
  </div>

  <div class="nav">
    <button type="button" class="nbtn" id="prev" aria-label="Page précédente">‹</button>
    <div class="progress">
      <div class="pcount" id="pcount"></div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
    </div>
    <button type="button" class="nbtn" id="next" aria-label="Page suivante">›</button>
  </div>
  <div class="hint">Fais défiler l'histoire • flèches ou glisse pour tourner la page 🌙</div>
</div>

<!-- VUE SOMMAIRE -->
<div class="menu" id="menuView">
  <header class="topbar">
    <div class="brand"><span class="moon"></span><b>Sommaire</b></div>
    <button type="button" class="home-btn" id="backBtn">← Lecture</button>
  </header>
  <div id="menuList"></div>
</div>

<script>
/* ==========================================================================
   BOÎTE À OUTILS D'ILLUSTRATION
   Toutes les scènes utilisent le même cadre 320x180, un sol à y=152,
   et des personnages dessinés « pieds à l'origine » que l'on place
   avec (x, y, échelle). Les dégradés viennent du bloc <defs> partagé.
   ========================================================================== */
const V=(inner)=>`<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;

/* --- petits éléments réutilisables --- */
const ombre=(x,y,rx,op)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*0.26}" fill="#1a1030" opacity="${op||.16}"/>`;
const etoile=(x,y,r,c)=>`<path d="M${x} ${y-r} L${x+r*0.3} ${y-r*0.3} L${x+r} ${y} L${x+r*0.3} ${y+r*0.3} L${x} ${y+r} L${x-r*0.3} ${y+r*0.3} L${x-r} ${y} L${x-r*0.3} ${y-r*0.3}Z" fill="${c||'#fff6cf'}"/>`;
const coeur=(x,y,s,c)=>`<path transform="translate(${x},${y}) scale(${s})" d="M0 7 C-9 0 -9 -7 -4.5 -7 C-2 -7 0 -5 0 -3.5 C0 -5 2 -7 4.5 -7 C9 -7 9 0 0 7Z" fill="${c||'#ff7a9c'}"/>`;
const nuage=(x,y,s,op)=>`<g transform="translate(${x},${y}) scale(${s})" opacity="${op||.92}"><ellipse cx="0" cy="0" rx="22" ry="12" fill="#fff"/><ellipse cx="-15" cy="4" rx="14" ry="9" fill="#fff"/><ellipse cx="16" cy="3" rx="15" ry="10" fill="#fff"/></g>`;
const fleur=(x,y,c)=>`<g transform="translate(${x},${y})"><rect x="-1" y="-1" width="2" height="9" fill="#3f7d24"/><circle cx="0" cy="-4" r="3.4" fill="${c}"/><circle cx="-3.4" cy="-1.6" r="2.6" fill="${c}"/><circle cx="3.4" cy="-1.6" r="2.6" fill="${c}"/><circle cx="0" cy="-4" r="1.4" fill="#ffe97a"/></g>`;
const arbre=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-6" y="-34" width="12" height="34" rx="4" fill="url(#gWood)"/><circle cx="0" cy="-46" r="26" fill="#3f9c35"/><circle cx="-18" cy="-36" r="17" fill="#4bb03e"/><circle cx="18" cy="-37" r="18" fill="#357f2c"/><circle cx="2" cy="-58" r="15" fill="#4bb03e"/></g>`;
const lune=(x,y,r)=>`<g><circle cx="${x}" cy="${y}" r="${r*2.6}" fill="url(#gGlow)" opacity=".55"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff3cf"/><circle cx="${x-r*0.35}" cy="${y-r*0.2}" r="${r*0.16}" fill="#f0dfb0"/><circle cx="${x+r*0.3}" cy="${y+r*0.3}" r="${r*0.12}" fill="#f0dfb0"/></g>`;
const soleil=(x,y,r)=>`<g><circle cx="${x}" cy="${y}" r="${r*2.4}" fill="url(#gGlow)" opacity=".7"/><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd85e"/></g>`;

/* semis d'étoiles fixe (pas d'aléatoire : rendu identique à chaque affichage) */
const CIEL_ETOILES=[[24,26,2],[58,14,1.5],[92,34,2.2],[128,18,1.4],[168,30,1.8],[206,16,2],[244,38,1.5],[286,22,2.2],[300,58,1.5],[16,62,1.6],[74,52,1.3],[150,50,1.5]];
const semisEtoiles=()=>CIEL_ETOILES.map(([x,y,r],i)=>`<circle class="a-spark" style="animation-delay:${(i*0.27).toFixed(2)}s" cx="${x}" cy="${y}" r="${r}" fill="#fff8dc"/>`).join('');

/* --- décors --- */
const bgNuit=()=>`<rect width="320" height="180" fill="url(#gNight)"/>${semisEtoiles()}${lune(268,36,16)}
  <path d="M0 152 Q60 126 120 146 Q180 166 240 140 Q280 124 320 142 L320 180 L0 180Z" fill="#1d1550"/>
  <path d="M0 162 Q80 146 160 160 Q240 174 320 158 L320 180 L0 180Z" fill="#151041"/>`;
const bgJour=()=>`<rect width="320" height="180" fill="url(#gDay)"/>${soleil(50,34,17)}
  <g class="a-drift">${nuage(120,36,1)}</g>${nuage(238,28,.8,.85)}
  <path d="M0 140 Q70 116 140 138 Q210 158 320 130 L320 180 L0 180Z" fill="#8ed36a"/>
  <rect y="152" width="320" height="28" fill="url(#gGrass)"/>`;
const bgSoir=()=>`<rect width="320" height="180" fill="url(#gDusk)"/>${semisEtoiles()}${lune(52,32,13)}
  <path d="M0 148 Q80 128 160 146 Q240 164 320 142 L320 180 L0 180Z" fill="#3c2a63"/>`;
const bgChambre=()=>`<rect width="320" height="180" fill="url(#gRoom)"/>
  <rect x="196" y="22" width="86" height="66" rx="8" fill="#20194f"/>
  <rect x="196" y="22" width="86" height="66" rx="8" fill="none" stroke="#c99a5e" stroke-width="5"/>
  <line x1="239" y1="22" x2="239" y2="88" stroke="#c99a5e" stroke-width="4"/>${lune(262,44,9)}
  <circle cx="212" cy="40" r="1.8" fill="#fff8dc"/><circle cx="222" cy="66" r="1.5" fill="#fff8dc"/>
  <rect y="150" width="320" height="30" fill="url(#gWood)"/>
  <ellipse cx="120" cy="164" rx="86" ry="13" fill="#e0a3b8" opacity=".55"/>`;
const bgSalon=()=>`<rect width="320" height="180" fill="url(#gRoom)"/>

/* Yasmine : le tout petit bébé, emmailloté, couché — centré sur (x,y) */
function yasmine(x,y,s,o){o=o||{};

/* Adultes : maman, papa, mamie, infirmière — pieds à l'origine */
function adulte(x,y,s,o){o=o||{};
  const hab=o.habit||'#e0559a', peau=o.peau||'#c98a52', chev=o.cheveux||'#2a1a11';
  const cheveux=o.style==='long'
    ? `<path d="M-16 -84 q3 -17 16 -16 q14 -1 16 16 q2 20 -3 26 q-2 -20 -13 -21 q-11 1 -13 21 q-5 -6 -3 -26Z" fill="${chev}"/>`
    : o.style==='foulard'
    ? `<path d="M-16 -84 q4 -16 16 -15 q13 -1 16 15 q1 8 -2 11 q-14 -8 -30 0 q-3 -3 0 -11Z" fill="${o.foulard||'#5bc7bd'}"/>`
    : `<path d="M-16 -84 q4 -16 16 -15 q13 -1 16 15 q-6 -7 -16 -6 q-10 -1 -16 6Z" fill="${chev}"/>`;
  const bras=(o.arms==='hold')
    ? `<rect x="-26" y="-58" width="10" height="28" rx="5" fill="${peau}" transform="rotate(28 -22 -56)"/><rect x="16" y="-58" width="10" height="28" rx="5" fill="${peau}" transform="rotate(-28 21 -56)"/>`

    ? `<rect x="-27" y="-72" width="10" height="30" rx="5" fill="${peau}" transform="rotate(-28 -22 -70)"/><rect x="17" y="-64" width="10" height="32" rx="5" fill="${peau}"/>`
    : `<rect x="-27" y="-64" width="10" height="33" rx="5" fill="${peau}"/><rect x="17" y="-64" width="10" height="33" rx="5" fill="${peau}"/>`;
  return `${ombre(x,y+1,20)}<g transform="translate(${x},${y}) scale(${s})">

    ${o.blouse?`<path d="M-19 -68 h9 l9 12 l9 -12 h9 l3 42 h-42Z" fill="#ffffff"/><rect x="-3" y="-30" width="18" height="4" rx="2" fill="#5bc7bd"/>`:''}
    ${bras}

    <circle cx="-5.8" cy="-81" r="2.5" fill="#26150c"/><circle cx="5.8" cy="-81" r="2.5" fill="#26150c"/>

  </g>`;}

   LES HISTOIRES
   Chaque histoire est une suite de « panneaux » : une illustration (a)

   ========================================================================== */
const C={hero:'Super-héros',fun:'Histoire drôle',manners:'Bonnes manières',family:'La famille'};
const CCOL={hero:'#ff8a3d',fun:'#ffcf3d',manners:'#5bd0e8',family:'#ff7a9c'};

const CATS=['family','hero','fun','manners'];

const STORIES=[

/* ============ LA FAMILLE (10) ============ */
{cat:'family',title:'La nouvelle qui change tout',panels:[
 {a:'hopAnnonce',t:"Un matin, papa est rentré dans la chambre avec un immense sourire. « Votre petite sœur est arrivée ! Elle s'appelle Yasmine. » Amine a sauté du lit et Leyla a tapé dans ses mains si fort qu'elle en a fait tomber son doudou."},
 {a:'hopCouloir',t:"« Elle est née un peu plus tôt que prévu, a expliqué maman en chemin. Alors elle reste quelques jours à l'hôpital, dans un petit lit tout chaud, le temps de devenir plus forte. » Amine tenait fort la main de Leyla dans le grand couloir tout blanc."},
 {a:'hopCouveuse',t:"Derrière une petite fenêtre transparente, Yasmine dormait, minuscule, avec un bonnet plus grand que sa tête. Amine l'a regardée longtemps. Dans son cœur, quelque chose de tout neuf venait de s'allumer : il était grand frère pour la deuxième fois."}]},

{cat:'family',title:'La plus petite main du monde',panels:[
 {a:'hopInfirmiere',t:"« Est-ce que je peux la toucher ? » a demandé Amine tout doucement. L'infirmière a souri et a ouvert un petit hublot rond sur le côté du lit chaud. « Bien sûr. Mais avec des mains toutes propres, et tout doucement. »"},
 {a:'hopMainMinuscule',t:"Amine a glissé son doigt près de la main de Yasmine. Elle était plus petite qu'une fraise. Et là, sans prévenir, les cinq minuscules doigts se sont refermés autour du sien et n'ont plus voulu le lâcher."},
 {a:'hopPeauAPeau',t:"Après, maman l'a installée tout contre elle, peau contre peau, sous une couverture jaune. « Comme ça, elle entend mon cœur, a expliqué maman. Ça l'aide à grandir. » Amine trouvait que c'était le meilleur médicament du monde."},
 {a:'hopBerceuse',t:"« Elle te reconnaît », a chuchoté maman. Amine n'a plus bougé pendant très longtemps. Il avait toujours cru qu'être fort, c'était soulever des choses lourdes. Ce soir-là, il a compris qu'être fort, c'est aussi savoir rester tout doux."}]},

{cat:'family',title:'Le dessin pour Yasmine',panels:[
 {a:'famPluie',t:"Il pleuvait, et on ne pouvait pas aller à l'hôpital ce jour-là. Alors Amine a sorti ses feutres. « Si on ne peut pas y aller, on va lui envoyer quelque chose de nous », a-t-il décidé. Leyla a choisi le rose, évidemment."},
 {a:'hopDessin',t:"Le lendemain, ils ont accroché le dessin tout près du lit de Yasmine : un soleil, quatre bonhommes, un bébé minuscule au milieu et beaucoup, beaucoup de cœurs. Même Leyla avait fait un gribouillis très appliqué."},
 {a:'hopVeilleuse',t:"La nuit, quand tout le monde était rentré à la maison, le dessin veillait sur Yasmine. « Comme ça, elle sait qu'on pense à elle même quand on n'est pas là », a dit Amine. C'est ça, une famille : on reste ensemble, même de loin."}]},

{cat:'family',title:'Le bonnet de mamie',panels:[
 {a:'famMamie',t:"Mamie est arrivée avec un panier et deux aiguilles. « Quand ton papa était bébé, je lui avais tricoté un bonnet jaune, a-t-elle raconté. Aujourd'hui, j'en tricote un pour Yasmine. » Amine a demandé s'il pouvait tenir la pelote."},
 {a:'hopBonnet',t:"Le bonnet était si petit qu'on aurait dit un bonnet de poupée. Sur la tête de Yasmine, il allait pile poil. « Il vient de loin, ce bonnet, a souri mamie. Il a traversé le temps pour arriver jusqu'à toi. »"},
 {a:'hopGrandit',t:"Chaque semaine, Yasmine devenait un peu plus grande. Un jour, le bonnet était devenu trop petit. Mamie en a tricoté un autre. Dans une famille, les choses se transmettent : les bonnets, les histoires, et surtout l'amour."}]},

{cat:'family',title:'Le repas où chacun raconte',panels:[
 {a:'famRepas',t:"Chez Amine, il y a une règle au dîner : chacun raconte le meilleur moment de sa journée. Papa a parlé d'un oiseau sur sa fenêtre, maman d'un câlin de Yasmine, Leyla a dit « gâteau » même si personne n'avait mangé de gâteau."},
 {a:'famCanape',t:"Le tour d'Amine est venu. « Mon meilleur moment, c'est maintenant. » Tout le monde s'est arrêté de manger. « Parce que là, on est tous en train de s'écouter en même temps. »"},
 {a:'nuitDodo',t:"Ce soir-là, en s'endormant, Amine s'est dit qu'une famille, ce n'est pas seulement des gens qui habitent ensemble. C'est des gens qui prennent le temps de s'écouter, même quand la journée a été longue."}]},

{cat:'family',title:'Le soir des étoiles',panels:[
 {a:'famJardin',t:"« Ce soir, on ne regarde pas d'écran, a annoncé papa. On sort les couvertures. » Amine a d'abord protesté, puis il a vu maman installer Yasmine bien emmitouflée dans ses bras, et il a couru chercher son oreiller."},
 {a:'nuitEtoiles',t:"Allongés dans l'herbe, ils ont compté les étoiles. Amine a montré la Grande Ourse à Leyla, qui a répondu « poisson ». Personne n'a corrigé : quand on est bien, on n'a pas besoin d'avoir raison."},
 {a:'nuitDodo',t:"« Il y a des milliards d'étoiles, a dit papa, mais une seule famille comme la nôtre. » Amine s'est endormi sur le chemin du lit, la joue contre l'épaule de son père, en pensant que c'était la meilleure soirée de sa vie."}]},

{cat:'family',title:'Le gâteau de la maison pleine',panels:[
 {a:'hopBiberon',t:"Yasmine avait appris à boire son biberon toute seule, jusqu'à la dernière goutte. C'était la dernière chose qu'elle devait savoir faire avant de pouvoir quitter l'hôpital."},
 {a:'famGateau',t:"Le docteur avait dit le mot que tout le monde attendait : Yasmine pouvait bientôt rentrer à la maison. Alors on a fait un gâteau. Amine a cassé les œufs, Leyla a surtout mangé le chocolat, et la cuisine a fini un peu blanche de farine."},
 {a:'hopRetourMaison',t:"Le grand jour, Yasmine est sortie de l'hôpital dans une couverture jaune. Les infirmières ont fait au revoir de la main. Amine leur a dit merci trois fois, parce qu'une seule fois, ça ne suffisait pas."},
 {a:'maisonBerceau',t:"Le berceau attendait dans la chambre depuis des semaines. Quand Yasmine s'y est endormie pour la première fois, la maison a fait un drôle de bruit : le silence de tout le monde qui sourit en même temps."}]},

{cat:'family',title:'La photo qui manquait',panels:[
 {a:'famMamie',t:"Dans le couloir, il y a un cadre avec une vieille photo : papa, maman, Amine bébé. « Elle n'est plus juste, cette photo, a remarqué Amine. Il manque deux personnes. » Mamie a proposé d'en refaire une."},
 {a:'famPhoto',t:"Ils se sont tous mis dans le jardin. Papa a réglé l'appareil, couru se placer, et il est arrivé en glissant sur l'herbe juste au moment du déclic. Sur la photo, tout le monde rit, même Yasmine qui dormait."},

/* ============ MOTEUR DU LIVRE ============ */
const COVER=-1;
let idx=COVER;
const bookEl=document.getElementById('book');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const pcount=document.getElementById('pcount');
const pfill=document.getElementById('pfill');
const total=STORIES.length;
const familleCount=STORIES.filter(s=>s.cat==='family').length;
const yasmineCount=STORIES.filter(s=>s.panels.some(p=>/Yasmine/.test(p.t))).length;
const panneauxCount=STORIES.reduce((n,s)=>n+s.panels.length,0);
console.assert(total===35, `STORIES devrait contenir 35 histoires, en contient ${total}`);
console.assert(familleCount===10, `il devrait y avoir 10 histoires « famille », il y en a ${familleCount}`);
console.assert(STORIES.every(s=>s.panels.every(p=>typeof SCENES[p.a]==='function')), 'une illustration référencée est introuvable dans SCENES');

/* texte complet d'une histoire, pour la lecture à voix haute */
const texteHistoire=(s)=>s.title+'. '+s.panels.map(p=>p.t).join(' ');

function coverHTML(){
  return `<div class="page cover" id="page">
    <div class="eyebrow">★ DODO TIME · TOME 3 ★</div>
    <h1>Le Grand Livre des Histoires du Soir</h1>
    <div class="sub">${total} histoires illustrées, dont ${familleCount} sur la famille — avec Amine, Leyla et la petite Yasmine</div>
    <div class="cover-art" aria-hidden="true">${SCENES.couverture()}</div>
    <button type="button" class="start" id="startBtn">Commencer ▶</button>
    <div class="pour">${panneauxCount} illustrations · une image à chaque moment du récit</div>
  </div>`;
}

function storyHTML(i){
  const s=STORIES[i];
  const panneaux=s.panels.map((p,n)=>`<div class="panel">
      <div class="pillus" aria-hidden="true">${SCENES[p.a]()}</div>
      <div class="step"><span class="dot" style="background:${CCOL[s.cat]}"></span>MOMENT ${n+1} / ${s.panels.length}</div>
      <p>${p.t}</p>
    </div>`).join('');
  return `<div class="page" id="page">
    <span class="cat-tag" style="background:${CCOL[s.cat]}">${CICON[s.cat]} ${C[s.cat]}</span>
    <span class="story-no">${String(i+1).padStart(2,'0')}/${total}</span>
    <h2>${s.title}</h2>
    <div class="story-scroll">${panneaux}</div>
    <div class="speak-ctl" id="speakCtl">
      <button type="button" class="speak-btn s-play" aria-label="Écouter l'histoire à voix haute">🔊 Écouter l'histoire</button>
      <button type="button" class="speak-btn s-pause" aria-label="Mettre en pause la lecture" style="display:none">⏸️ Pause</button>
      <button type="button" class="speak-btn s-stop" aria-label="Arrêter la lecture" style="display:none">⏹️</button>
    </div>
    <div class="audio-progress" id="audioProgress">
      <div class="alabel" id="alabel">Progression de la lecture</div>
      <div class="abar" role="progressbar" aria-labelledby="alabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="afill" id="afill"></div></div>
    </div>
  </div>`;
}

function render(){
  if(typeof stopSpeak==='function') stopSpeak();
  // re-acquérir l'élément vivant : après outerHTML, l'ancienne référence est détachée
  document.getElementById('page').outerHTML = (idx===COVER)?coverHTML():storyHTML(idx);
  rebind();
  if(idx===COVER){pcount.textContent='Couverture';pfill.style.width='0%';}
  else{pcount.textContent=`Page ${idx+1} sur ${total}`;pfill.style.width=`${((idx+1)/total)*100}%`;}
  prevBtn.disabled=(idx===COVER);
  nextBtn.disabled=(idx===total-1);
}
function rebind(){
  const sb=document.getElementById('startBtn');
  if(sb) sb.onclick=()=>turn(1);
  const ctl=document.getElementById('speakCtl');
  if(ctl){
    if('speechSynthesis' in window){
      ctl.querySelector('.s-play').onclick=startSpeak;
      ctl.querySelector('.s-pause').onclick=togglePause;
      ctl.querySelector('.s-stop').onclick=stopSpeak;
      updateSpeakUI();
    } else {
      ctl.style.display='none';   // navigateur sans synthèse vocale
      const ap=document.getElementById('audioProgress'); if(ap) ap.style.display='none';
    }
  }
}

/* ===== LECTURE À VOIX HAUTE + jauge de progression ===== */
let speaking=false, paused=false, speakLen=0;
let cachedFrVoice=null;
function pickFrVoice(){
  const vs=window.speechSynthesis.getVoices()||[];
  return vs.find(v=>/^fr-fr$/i.test(v.lang)) || vs.find(v=>/^fr(-|_)/i.test(v.lang)) || vs.find(v=>(v.lang||'').toLowerCase().startsWith('fr')) || null;
}
function refreshFrVoice(){ cachedFrVoice=pickFrVoice(); }
function updateSpeakUI(){
  const ctl=document.getElementById('speakCtl');
  if(!ctl) return;
  const play=ctl.querySelector('.s-play'), pause=ctl.querySelector('.s-pause'), stop=ctl.querySelector('.s-stop');
  if(!speaking){
    play.style.display=''; pause.style.display='none'; stop.style.display='none';
  } else {
    play.style.display='none'; pause.style.display=''; stop.style.display='';
    pause.innerHTML = paused ? '▶️ Reprendre' : '⏸️ Pause';
    pause.setAttribute('aria-label', paused ? 'Reprendre la lecture' : 'Mettre en pause la lecture');
  }
  const ap=document.getElementById('audioProgress');
  if(ap) ap.style.display = speaking ? 'flex' : 'none';
}
let lastProgressPct=0;
function setAudioProgress(pct){
  const p=Math.max(0,Math.min(100,pct));
  if(p<lastProgressPct) return; // la jauge n'avance que vers l'avant (onboundary vs secours temporel)
  lastProgressPct=p;
  const af=document.getElementById('afill');
  if(af) af.style.width = p+'%';
  const ab=document.querySelector('.abar');
  if(ab) ab.setAttribute('aria-valuenow', Math.round(p));
}
function resetAudioProgress(){
  lastProgressPct=0;
  const af=document.getElementById('afill');
  if(af) af.style.width='0%';
  const ab=document.querySelector('.abar');
  if(ab) ab.setAttribute('aria-valuenow','0');
}
/* secours basé sur le temps estimé : certains navigateurs (ex. Safari iOS)
   ne déclenchent jamais onboundary, la jauge resterait alors figée à 0% */
let progTimer=null, progStart=0, progEstMs=0, progPausedAt=0;
function tickProgress(){ setAudioProgress(Math.min(96,(Date.now()-progStart)/progEstMs*100)); }
function startProgressFallback(estMs){
  progEstMs=estMs; progStart=Date.now();
  clearInterval(progTimer);
  progTimer=setInterval(tickProgress,200);
}
function pauseProgressFallback(){ clearInterval(progTimer); progTimer=null; progPausedAt=Date.now(); }
function resumeProgressFallback(){
  if(!progEstMs) return;
  progStart += (Date.now()-progPausedAt);
  progTimer=setInterval(tickProgress,200);
}
function stopProgressFallback(){ clearInterval(progTimer); progTimer=null; progEstMs=0; }

function stopSpeak(){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  speaking=false; paused=false;
  stopProgressFallback();
  resetAudioProgress();
  updateSpeakUI();
}
function startSpeak(){
  if(!('speechSynthesis' in window)||idx===COVER) return;
  const fullText=texteHistoire(STORIES[idx]);
  speakLen = fullText.length || 1;
  const u=new SpeechSynthesisUtterance(fullText);
  u.lang='fr-FR';u.rate=0.85;u.pitch=1.05;      // débit ralenti, voix douce pour l'enfant
  const v=cachedFrVoice||pickFrVoice();if(v){u.voice=v;u.lang=v.lang;}
  const estMs=Math.max(2000,fullText.length*70);  // ~70 ms/caractère à ce débit
  u.onstart=()=>{ startProgressFallback(estMs); };
  u.onboundary=(e)=>{
    if(typeof e.charIndex==='number') setAudioProgress((e.charIndex/speakLen)*100);
  };
  u.onend=()=>{
    stopProgressFallback();
    setAudioProgress(100);   // flash de complétion avant de masquer la jauge
    paused=false;
    setTimeout(()=>{ speaking=false; resetAudioProgress(); updateSpeakUI(); },450);
  };
  u.onerror=()=>{speaking=false;paused=false;stopProgressFallback();resetAudioProgress();updateSpeakUI();};
  window.speechSynthesis.cancel();
  // Chrome avorte parfois un speak() lancé dans le même tick qu'un cancel() : court délai
  setTimeout(()=>window.speechSynthesis.speak(u),50);
  speaking=true; paused=false;
  resetAudioProgress();
  updateSpeakUI();
}
function togglePause(){
  if(!speaking) return;
  if(paused){ window.speechSynthesis.resume(); paused=false; resumeProgressFallback(); }
  else      { window.speechSynthesis.pause();  paused=true;  pauseProgressFallback(); }
  updateSpeakUI();
}
// certaines plateformes chargent la liste des voix de façon asynchrone
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=refreshFrVoice; refreshFrVoice(); }

let busy=false;
function turn(dir){
  if(busy) return;
  const target=idx+dir;
  if(target<COVER||target>total-1) return;
  busy=true;
  const cur=document.getElementById('page');
  cur.classList.add('flip-out');
  setTimeout(()=>{
    idx=target;
    render();
    const np=document.getElementById('page');
    np.classList.add('flip-in');
    let safety;
    const release=()=>{np.classList.remove('flip-in');busy=false;clearTimeout(safety);};
    np.addEventListener('animationend',release,{once:true});
    safety=setTimeout(release,500);   // sécurité si animationend ne se déclenche pas
  },340);
}

prevBtn.onclick=()=>turn(-1);
nextBtn.onclick=()=>turn(1);
document.addEventListener('keydown',e=>{
  if(document.getElementById('menuView').classList.contains('show')) return;
  if(e.key==='ArrowRight') turn(1);
  if(e.key==='ArrowLeft') turn(-1);
});

// swipe (on ignore les défilements verticaux : la page se lit en scrollant)
let sx=0, sy=0;
bookEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
bookEl.addEventListener('touchend',e=>{
  if(document.getElementById('menuView').classList.contains('show')) return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) turn(1); else turn(-1); }
});

/* ===== SOMMAIRE ===== */
const menuBtn=document.getElementById('menuBtn');
const backBtn=document.getElementById('backBtn');
const menuView=document.getElementById('menuView');
const bookView=document.getElementById('bookView');
const menuList=document.getElementById('menuList');

function buildMenu(){
  const groups={hero:[],fun:[],manners:[],family:[]};
  STORIES.forEach((s,i)=>groups[s.cat].push({s,i}));
  let html='';
  for(const k of CATS){
    html+=`<h3><span class="pip" style="background:${CCOL[k]}"></span>${CICON[k]} ${C[k]} (${groups[k].length})</h3><div class="cards">`;
    groups[k].forEach(({s,i})=>{
      html+=`<div class="scard" role="button" tabindex="0" data-i="${i}">
        <span class="nn">N°${String(i+1).padStart(2,'0')}</span>
        <span class="tt">${s.title}</span></div>`;
    });
    html+='</div>';
  }
  menuList.innerHTML=html;
  menuList.querySelectorAll('.scard').forEach(c=>{
    const go=()=>{
      const n=parseInt(c.dataset.i,10);
      if(!Number.isInteger(n)||n<0||n>=total) return;
      idx=n;busy=false;closeMenu();render();
    };
    c.onclick=go;
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
}
function openMenu(){stopSpeak();busy=false;menuView.classList.add('show');bookView.style.display='none';buildMenu();}
function closeMenu(){menuView.classList.remove('show');bookView.style.display='flex';}
menuBtn.onclick=openMenu;
backBtn.onclick=closeMenu;

/* étoiles d'ambiance */
const starWrap=document.getElementById('stars');
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  for(let i=0;i<40;i++){
    const d=document.createElement('div');
    d.className='star-dot';
    const sz=Math.random()*2.4+1;
    d.style.width=d.style.height=sz+'px';
    d.style.left=Math.random()*100+'%';
    d.style.top=Math.random()*100+'%';
    d.style.animationDelay=(Math.random()*3)+'s';
    starWrap.appendChild(d);
  }
}

render();
</script>
