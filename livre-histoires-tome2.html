<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Le Grand Livre des Histoires du Soir — Tome 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#1a1147;
    --night-2:#2a1f6b;
    --night-3:#3b2c8f;
    --lamp:#ffd27a;
    --lamp-soft:#ffe9c2;
    --page:#fff7ea;
    --page-edge:#f0e2c8;
    --ink:#3a2e4f;
    --ink-soft:#6b5f7d;
    --grass:#6cbb3c;
    --grass-d:#4e8a2a;
    --creeper:#67c860;
    --goku-aura:#ffd60a;
    --diamond:#5be0d8;
    --heart:#ff7a9c;
    --cat-hero:#ff8a3d;
    --cat-fun:#ffcf3d;
    --cat-manners:#5bd0e8;
    --cat-family:#ff7a9c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Baloo 2','Fredoka','Trebuchet MS',sans-serif;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,210,122,.18), transparent 40%),
      radial-gradient(circle at 82% 85%, rgba(91,224,216,.14), transparent 45%),
      linear-gradient(160deg,var(--night-1),var(--night-2) 55%,var(--night-3));
    color:var(--page);
    min-height:100%;
    overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:14px;
  }
  /* étoiles d'ambiance */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star-dot{position:absolute;background:#fff;border-radius:50%;opacity:.8;
    animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}

  .wrap{position:relative;z-index:2;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}

  header.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .moon{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff6da,#ffd27a);
    box-shadow:0 0 16px rgba(255,210,122,.7);}
  .brand b{font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;}
  .home-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    color:var(--page);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
    padding:8px 14px;border-radius:14px;cursor:pointer;backdrop-filter:blur(4px);transition:.2s;}
  .home-btn:hover{background:rgba(255,255,255,.22);}
  .home-btn:active{transform:scale(.96);}

  /* === LIVRE === */
  .book{position:relative;width:100%;aspect-ratio:3/4;max-height:74vh;
    perspective:1800px;}
  .page{
    position:absolute;inset:0;background:linear-gradient(160deg,var(--page),#fdeccf);
    border-radius:22px;
    box-shadow:0 18px 40px rgba(10,6,40,.55), inset 0 0 0 6px rgba(255,255,255,.5),
      inset 6px 0 22px rgba(0,0,0,.06);
    color:var(--ink);
    padding:20px 20px 16px;
    display:flex;flex-direction:column;
    transform-origin:left center;
    backface-visibility:hidden;
    overflow:hidden;
  }
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;
    background:linear-gradient(90deg,rgba(0,0,0,.10),transparent);border-radius:22px 0 0 22px;}
  .page.flip-out{animation:flipOut .34s ease-in forwards;}
  .page.flip-in{animation:flipIn .34s ease-out forwards;}
  @keyframes flipOut{from{transform:rotateY(0);opacity:1}to{transform:rotateY(-95deg);opacity:.25}}
  @keyframes flipIn{from{transform:rotateY(95deg);opacity:.25}to{transform:rotateY(0);opacity:1}}

  /* bandeau catégorie */
  .cat-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.6px;color:#fff;padding:5px 12px;border-radius:999px;margin-bottom:6px;}
  .story-no{position:absolute;top:18px;right:20px;font-family:'Press Start 2P',monospace;
    font-size:11px;color:var(--ink-soft);opacity:.8;}

  .illus{width:100%;height:42%;min-height:150px;display:flex;align-items:center;justify-content:center;
    margin:2px 0 6px;}
  .illus svg{width:auto;height:100%;max-width:100%;}

  .page h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(20px,5.4vw,26px);
    line-height:1.1;margin:2px 0 8px;color:var(--ink);}
  .story-text{font-size:clamp(15px,3.9vw,18px);line-height:1.5;color:#4a3d5c;overflow-y:auto;flex:1;padding-right:4px;}
  .story-text p{margin:0 0 10px;}
  .story-text::-webkit-scrollbar{width:8px;}
  .story-text::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:8px;}

  /* COUVERTURE */
  .cover{align-items:center;justify-content:center;text-align:center;gap:6px;
    background:
      radial-gradient(circle at 50% 22%, rgba(255,210,122,.45), transparent 55%),
      linear-gradient(165deg,#2a1f6b,#1a1147);
    color:var(--page);}
  .cover::before{display:none;}
  .cover .eyebrow{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;color:var(--lamp);}
  .cover h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(26px,7vw,40px);
    line-height:1.05;margin:6px 18px 4px;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  .cover .sub{font-size:15px;color:var(--lamp-soft);margin-bottom:8px;}
  .cover .cover-art{height:36%;min-height:120px;display:flex;align-items:center;justify-content:center;}
  .cover .start{margin-top:14px;background:linear-gradient(180deg,#ff9d4d,#ff7a3d);
    color:#fff;border:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;
    padding:13px 30px;border-radius:18px;cursor:pointer;box-shadow:0 8px 0 #c9531f,0 14px 24px rgba(0,0,0,.4);
    transition:.12s;}
  .cover .start:active{transform:translateY(5px);box-shadow:0 3px 0 #c9531f;}
  .cover .pour{margin-top:12px;font-size:14px;color:rgba(255,255,255,.7);}

  /* SOMMAIRE */
  .menu{position:relative;z-index:2;width:100%;max-width:560px;display:none;flex-direction:column;gap:14px;}
  .menu.show{display:flex;}
  .menu h3{font-family:'Fredoka',sans-serif;font-weight:700;font-size:17px;margin:4px 2px;
    display:flex;align-items:center;gap:8px;color:#fff;}
  .menu h3 .pip{width:12px;height:12px;border-radius:4px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .scard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:.15s;backdrop-filter:blur(3px);}
  .scard:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
  .scard:active{transform:scale(.97);}
  .scard .nn{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--lamp);}
  .scard .tt{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;line-height:1.15;color:#fff;}

  /* NAV */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:14px;}
  .nbtn{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(180deg,#6a4fd0,#4a34a8);color:#fff;font-size:26px;font-weight:700;
    box-shadow:0 6px 0 #2e1f74,0 10px 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
    transition:.12s;}
  .nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e1f74;}
  .nbtn:disabled{opacity:.35;box-shadow:0 6px 0 #2e1f74;cursor:default;}
  .progress{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;}
  .pcount{font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;color:var(--lamp-soft);}
  .pbar{width:100%;height:9px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,var(--lamp),#ff8a3d);border-radius:999px;transition:width .35s ease;}

  .hint{margin-top:10px;font-size:12px;color:rgba(255,255,255,.55);text-align:center;}

  /* contrôles de lecture à voix haute */
  .speak-ctl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex:0 0 auto;flex-wrap:wrap;}
  .speak-btn{background:linear-gradient(180deg,#ffd27a,#ffba4a);color:#5a3b12;border:none;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;
    padding:10px 18px;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 0 #c98a2a,0 8px 14px rgba(0,0,0,.18);transition:.12s;}
  .speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c98a2a;}
  .speak-btn.s-pause{background:linear-gradient(180deg,#9be7a0,#5fcf6a);color:#0f481b;box-shadow:0 4px 0 #2f8a3a;}
  .speak-btn.s-pause:active{box-shadow:0 1px 0 #2f8a3a;}
  .speak-btn.s-stop{background:linear-gradient(180deg,#ff9d9d,#ff6b6b);color:#fff;box-shadow:0 4px 0 #c93a3a;padding:10px 14px;}
  .speak-btn.s-stop:active{box-shadow:0 1px 0 #c93a3a;}
  .speak-btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px;}

  /* jauge de progression audio (lecture à voix haute) */
  .audio-progress{width:100%;display:none;flex-direction:column;align-items:center;gap:4px;margin-top:8px;}
  .audio-progress .alabel{font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;color:var(--lamp-soft);letter-spacing:.3px;}
  .abar{width:100%;height:7px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}
  .afill{height:100%;width:0%;background:linear-gradient(90deg,var(--diamond),#3ec8c0);border-radius:999px;transition:width .25s linear;}

  /* ANIMATIONS ILLUSTRATIONS */
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}60%{transform:translateY(-8px)}}
  @keyframes shoot{0%{transform:translate(40px,-40px);opacity:0}20%{opacity:1}100%{transform:translate(-30px,30px);opacity:0}}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  .a-float{animation:float 3s ease-in-out infinite;transform-origin:center;}
  .a-bob{animation:bob 2.4s ease-in-out infinite;transform-origin:center bottom;}
  .a-pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;}
  .a-spin{animation:spin 9s linear infinite;transform-origin:center;}
  .a-spark{animation:spark 1.6s ease-in-out infinite;transform-origin:center;}
  .a-sway{animation:sway 3s ease-in-out infinite;transform-origin:center bottom;}
  .a-bounce{animation:bounce 1.6s ease-in-out infinite;transform-origin:center bottom;}
  .a-shoot{animation:shoot 2.2s ease-in infinite;}
  .a-hue{animation:hue 6s linear infinite;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;}
    .star-dot{display:none;}
  }
  .nbtn:focus-visible,.home-btn:focus-visible,.scard:focus-visible,.start:focus-visible{outline:3px solid var(--lamp);outline-offset:3px;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- VUE LIVRE -->
<div class="wrap" id="bookView">
  <header class="topbar">
    <div class="brand"><span class="moon"></span><b>Histoires du Soir · T2</b></div>
    <button type="button" class="home-btn" id="menuBtn">📖 Sommaire</button>
  </header>

  <div class="book" id="book">
    <div class="page" id="page"></div>
  </div>

  <div class="nav">
    <button type="button" class="nbtn" id="prev" aria-label="Page précédente">‹</button>
    <div class="progress">
      <div class="pcount" id="pcount"></div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
    </div>
    <button type="button" class="nbtn" id="next" aria-label="Page suivante">›</button>
  </div>
  <div class="hint">Touche les flèches ou glisse la page • Bonne nuit 🌙</div>
</div>

<!-- VUE SOMMAIRE -->
<div class="menu" id="menuView">
  <header class="topbar">
    <div class="brand"><span class="moon"></span><b>Sommaire</b></div>
    <button type="button" class="home-btn" id="backBtn">← Lecture</button>
  </header>
  <div id="menuList"></div>
</div>

<script>
/* ============ ILLUSTRATIONS (SVG + animation) ============ */
function px(x,y,w,h,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}

// Figure réutilisable d'Amine (héros à la cape rouge), centrée ~ (100,100)
function amineHero(o){
  o=o||{};
  const cape = (o.cape!==false)
    ? `<g class="a-sway"><path d="M82 80 Q56 124 70 170 L100 150 L100 88 Z" fill="#e23b4e"/>
        <path d="M118 80 Q144 124 130 170 L100 150 L100 88 Z" fill="#c8243a"/></g>` : '';
  const arms = (o.armUp!==false)
    ? `<rect x="118" y="58" width="13" height="34" rx="6" fill="#c68642" transform="rotate(32 124 75)"/>
       <rect x="69" y="86" width="13" height="32" rx="6" fill="#c68642"/>`
    : `<rect x="64" y="88" width="13" height="32" rx="6" fill="#c68642"/>
       <rect x="123" y="88" width="13" height="32" rx="6" fill="#c68642"/>`;
  return `${cape}<g class="a-float">
      <circle cx="100" cy="58" r="26" fill="#c68642"/>
      <path d="M75 54 Q100 24 125 54 Q126 40 100 35 Q74 40 75 54 Z" fill="#241006"/>
      ${px(89,55,7,8,'#241006')}${px(104,55,7,8,'#241006')}
      <path d="M92 70 q8 7 16 0" stroke="#7a4a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="78" y="82" width="44" height="46" rx="11" fill="#2b6fd6"/>
      <path d="M100 92 l7 15 -7 5 -7-5 z" fill="#ffd60a"/>
      ${arms}
      <rect x="82" y="128" width="15" height="30" rx="5" fill="#26408c"/>
      <rect x="103" y="128" width="15" height="30" rx="5" fill="#26408c"/>
    </g>`;
}

// Figure réutilisable de Leyla (la petite sœur de 2 ans), repère interne centré sur son torse
function leylaToddler(o){
  o=o||{};
  const armUp=(o.armUp!==false);
  const arm = armUp
    ? `<rect x="10" y="6" width="9" height="20" rx="4" fill="#f3c9a0" transform="rotate(-30 14 12)"/>`
    : `<rect x="10" y="16" width="9" height="20" rx="4" fill="#f3c9a0"/>`;
  return `<g>
      <circle cx="-13" cy="-20" r="6" fill="#3a2a18"/>
      <circle cx="13" cy="-20" r="6" fill="#3a2a18"/>
      <circle cx="0" cy="-8" r="16" fill="#f3c9a0"/>
      <path d="M-14 -16 Q0 -30 14 -16 Q13 -22 0 -23 Q-13 -22 -14 -16 Z" fill="#3a2a18"/>
      <circle cx="-6" cy="-10" r="2.2" fill="#241006"/><circle cx="6" cy="-10" r="2.2" fill="#241006"/>
      <path d="M-5 -1 q5 4 10 0" stroke="#a05a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="26" rx="16" ry="9" fill="#a85ad0"/>
      <rect x="-15" y="2" width="30" height="26" rx="13" fill="#c878dd"/>
      <rect x="-23" y="6" width="9" height="16" rx="4" fill="#f3c9a0"/>
      ${arm}
      <rect x="-9" y="26" width="8" height="12" rx="4" fill="#f3c9a0"/>
      <rect x="1" y="26" width="8" height="12" rx="4" fill="#f3c9a0"/>
    </g>`;
}

const SCENES = {
  // --- AMINE seul ---
  amine(){return `<svg viewBox="0 0 200 200">
    <g class="a-pulse"><circle cx="100" cy="98" r="60" fill="#ff8a3d" opacity=".20"/></g>
    ${amineHero({armUp:true})}
    <g class="a-spark"><path d="M150 48 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z" fill="#fff"/></g>
    <g class="a-spark" style="animation-delay:.7s"><path d="M44 66 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" fill="#ffd60a"/></g>
    ${px(20,160,160,30,'#4e8a2a')}${px(20,160,160,8,'#6cbb3c')}</svg>`;},

  // --- AMINE & LEYLA (10 scènes) ---
  amineLeylaTower(){return `<svg viewBox="0 0 200 200">
    <g class="a-bob"><rect x="20" y="120" width="26" height="26" fill="#caa07a"/><rect x="20" y="94" width="26" height="26" fill="#e8c29a"/><rect x="20" y="68" width="26" height="26" fill="#caa07a"/></g>
    <g transform="translate(-10,8) scale(0.8)">${amineHero({armUp:true})}</g>
    <g transform="translate(150,118) scale(1.7)">${leylaToddler({armUp:true})}</g>
    ${px(20,160,160,30,'#4e8a2a')}${px(20,160,160,8,'#6cbb3c')}</svg>`;},

  amineLeylaMonster(){return `<svg viewBox="0 0 200 200">
    <g class="a-float"><circle cx="150" cy="44" r="22" fill="#ffe9a8"/><circle cx="160" cy="38" r="19" fill="#1a1147"/></g>
    <g class="a-sway"><ellipse cx="48" cy="80" rx="22" ry="30" fill="#2a1f6b" opacity=".55"/></g>
    <g transform="translate(-12,10) scale(0.8)">${amineHero({armUp:false})}</g>
    <g transform="translate(150,120) scale(1.7)">${leylaToddler({armUp:false})}</g>
    ${px(20,162,160,28,'#3a4a8a')}${px(20,162,160,8,'#5a6ab0')}</svg>`;},

  amineLeylaRescue(){return `<svg viewBox="0 0 200 200">
    <g class="a-pulse"><ellipse cx="120" cy="150" rx="50" ry="16" fill="#5bd0e8" opacity=".5"/></g>
    <g class="a-bounce"><circle cx="128" cy="138" r="11" fill="#ff7a3d"/></g>
    <g transform="translate(-30,6) scale(0.82)">${amineHero({armUp:true})}</g>
    <g transform="translate(150,108) scale(1.6)">${leylaToddler({armUp:false})}</g>
    ${px(0,168,200,32,'#4e8a2a')}</svg>`;},

  amineLeylaCape(){return `<svg viewBox="0 0 200 200">
    <g class="a-pulse"><circle cx="100" cy="100" r="64" fill="#ffd60a" opacity=".18"/></g>
    <g transform="translate(-12,8) scale(0.8)">${amineHero({armUp:true})}</g>
    <g class="a-sway" transform="translate(150,118) scale(1.7)"><path d="M-14 -2 Q-30 24 -18 46 L0 32 L0 4 Z" fill="#a85ad0"/></g>
    <g transform="translate(150,118) scale(1.7)">${leylaToddler({armUp:true})}</g>
    ${px(20,160,160,30,'#4e8a2a')}${px(20,160,160,8,'#6cbb3c')}</svg>`;},

  amineLeylaPeekaboo(){return `<svg viewBox="0 0 200 200">
    <g class="a-spark"><text x="36" y="46" font-size="20">✨</text></g>
    <g class="a-spark" style="animation-delay:.6s"><text x="148" y="60" font-size="20">✨</text></g>
    <g transform="translate(-14,10) scale(0.8)">${amineHero({armUp:true})}</g>
    <g transform="translate(150,120) scale(1.7)">${leylaToddler({armUp:true})}</g>
    ${px(20,160,160,30,'#4e8a2a')}${px(20,160,160,8,'#6cbb3c')}</svg>`;},

  amineLeylaMess(){return `<svg viewBox="0 0 200 200">
    <g class="a-spin"><circle cx="40" cy="60" r="7" fill="#ff5757"/></g>
    <g class="a-spin" style="animation-delay:.3s"><circle cx="160" cy="50" r="6" fill="#19a0e0"/></g>
    <g class="a-spin" style="animation-delay:.6s"><circle cx="56" cy="150" r="6" fill="#3aa24a"/></g>
    <g class="a-spin" style="animation-delay:.9s"><circle cx="150" cy="148" r="7" fill="#ffd84d"/></g>
    <g transform="translate(-12,10) scale(0.8)">${amineHero({armUp:false})}</g>
    <g transform="translate(150,120) scale(1.7)">${leylaToddler({armUp:true})}</g></svg>`;},

  amineLeylaShare(){return `<svg viewBox="0 0 200 200">
    <g class="a-bob"><ellipse cx="100" cy="118" rx="18" ry="14" fill="#caa07a"/><circle cx="100" cy="100" r="13" fill="#caa07a"/>
      ${px(95,96,4,4,'#222')}${px(103,96,4,4,'#222')}</g>
    <g transform="translate(-26,10) scale(0.78)">${amineHero({armUp:false})}</g>
    <g transform="translate(150,120) scale(1.6)">${leylaToddler({armUp:false})}</g>

{cat:'hero',scene:'team',title:'Le trio contre la tempête de sable',text:[

{cat:'hero',scene:'diamond',title:'Le bouclier en diamant',text:[

{cat:'hero',scene:'creeper',title:'Le petit creeper qui voulait aider',text:[

{cat:'hero',scene:'amine',title:'Amine et le ballon coincé',text:[

/* ============ MOTEUR DU LIVRE ============ */
const COVER=-1;
let idx=COVER;
const bookEl=document.getElementById('book');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const pcount=document.getElementById('pcount');
const pfill=document.getElementById('pfill');
const total=STORIES.length;
const amineLeylaCount=STORIES.filter(s=>/^amineLeyla/.test(s.scene)).length;
console.assert(total===31, `STORIES devrait contenir 31 histoires, en contient ${total}`);
console.assert(amineLeylaCount===10, `amineLeylaCount devrait être 10, vaut ${amineLeylaCount}`);

function coverHTML(){
  return `<div class="page cover" id="page">
    <div class="eyebrow">★ DODO TIME · TOME 2 ★</div>
    <h1>Le Grand Livre des Histoires du Soir</h1>
    <div class="sub">${total} nouvelles histoires, dont ${amineLeylaCount} avec Amine et sa petite sœur Leyla</div>
    <div class="cover-art" aria-hidden="true">${SCENES.amineLeylaCape()}</div>
    <button type="button" class="start" id="startBtn">Commencer ▶</button>
    <div class="pour">Minecraft · Roblox · Dragon Ball · Amine & Leyla</div>
  </div>`;
}
function storyHTML(i){
  const s=STORIES[i];
  return `<div class="page" id="page">
    <span class="cat-tag" style="background:${CCOL[s.cat]}">${CICON[s.cat]} ${C[s.cat]}</span>
    <span class="story-no">${String(i+1).padStart(2,'0')}/${total}</span>
    <div class="illus" aria-hidden="true">${SCENES[s.scene]()}</div>
    <h2>${s.title}</h2>
    <div class="story-text">${s.text.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="speak-ctl" id="speakCtl">
      <button type="button" class="speak-btn s-play" aria-label="Écouter l'histoire à voix haute">🔊 Écouter l'histoire</button>
      <button type="button" class="speak-btn s-pause" aria-label="Mettre en pause ou reprendre la lecture" style="display:none">⏸️ Pause</button>
      <button type="button" class="speak-btn s-stop" aria-label="Arrêter la lecture" style="display:none">⏹️</button>
    </div>
    <div class="audio-progress" id="audioProgress">
      <div class="alabel" id="alabel">Progression de la lecture</div>
      <div class="abar" role="progressbar" aria-labelledby="alabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="afill" id="afill"></div></div>
    </div>
  </div>`;
}
function render(){
  if(typeof stopSpeak==='function') stopSpeak();
  // re-acquérir l'élément vivant : après outerHTML, l'ancienne référence est détachée
  document.getElementById('page').outerHTML = (idx===COVER)?coverHTML():storyHTML(idx);
  rebind();
  // progression des pages
  if(idx===COVER){pcount.textContent='Couverture';pfill.style.width='0%';}
  else{pcount.textContent=`Page ${idx+1} sur ${total}`;pfill.style.width=`${((idx+1)/total)*100}%`;}
  prevBtn.disabled=(idx===COVER);
  nextBtn.disabled=(idx===total-1);
}
function rebind(){
  const sb=document.getElementById('startBtn');
  if(sb) sb.onclick=()=>turn(1);
  const ctl=document.getElementById('speakCtl');
  if(ctl){
    if('speechSynthesis' in window){
      ctl.querySelector('.s-play').onclick=startSpeak;
      ctl.querySelector('.s-pause').onclick=togglePause;
      ctl.querySelector('.s-stop').onclick=stopSpeak;
      updateSpeakUI();
    } else {
      ctl.style.display='none';   // navigateur sans synthèse vocale
      const ap=document.getElementById('audioProgress'); if(ap) ap.style.display='none';
    }
  }
}

/* ===== LECTURE À VOIX HAUTE (synthèse vocale) + jauge de progression ===== */
let speaking=false, paused=false, speakLen=0;
let cachedFrVoice=null;
function pickFrVoice(){
  const vs=window.speechSynthesis.getVoices()||[];
  return vs.find(v=>/^fr-fr$/i.test(v.lang)) || vs.find(v=>/^fr(-|_)/i.test(v.lang)) || vs.find(v=>(v.lang||'').toLowerCase().startsWith('fr')) || null;
}
function refreshFrVoice(){ cachedFrVoice=pickFrVoice(); }
function updateSpeakUI(){
  const ctl=document.getElementById('speakCtl');
  if(!ctl) return;
  const play=ctl.querySelector('.s-play'), pause=ctl.querySelector('.s-pause'), stop=ctl.querySelector('.s-stop');
  if(!speaking){
    play.style.display=''; pause.style.display='none'; stop.style.display='none';
  } else {
    play.style.display='none'; pause.style.display=''; stop.style.display='';
    pause.innerHTML = paused ? '▶️ Reprendre' : '⏸️ Pause';
    pause.setAttribute('aria-label', paused ? 'Reprendre la lecture' : 'Mettre en pause la lecture');
  }
  const ap=document.getElementById('audioProgress');
  if(ap) ap.style.display = speaking ? 'flex' : 'none';
}
let lastProgressPct=0;
function setAudioProgress(pct){
  const p=Math.max(0,Math.min(100,pct));
  if(p<lastProgressPct) return; // onboundary et secours temporel ne se contredisent jamais : la jauge n'avance que vers l'avant
  lastProgressPct=p;
  const af=document.getElementById('afill');
  if(af) af.style.width = p+'%';
  const ab=document.querySelector('.abar');
  if(ab) ab.setAttribute('aria-valuenow', Math.round(p));
}
function resetAudioProgress(){
  lastProgressPct=0;
  const af=document.getElementById('afill');
  if(af) af.style.width='0%';
  const ab=document.querySelector('.abar');
  if(ab) ab.setAttribute('aria-valuenow','0');
}
// secours basé sur le temps estimé : certains navigateurs (ex. Safari iOS)
// ne déclenchent jamais onboundary, la jauge resterait alors figée à 0%
let progTimer=null, progStart=0, progEstMs=0, progPausedAt=0;
function tickProgress(){
  setAudioProgress(Math.min(96,(Date.now()-progStart)/progEstMs*100));
}
function startProgressFallback(estMs){
  progEstMs=estMs; progStart=Date.now();
  clearInterval(progTimer);
  progTimer=setInterval(tickProgress,200);
}
function pauseProgressFallback(){ clearInterval(progTimer); progTimer=null; progPausedAt=Date.now(); }
function resumeProgressFallback(){
  if(!progEstMs) return;
  progStart += (Date.now()-progPausedAt);
  progTimer=setInterval(tickProgress,200);
}
function stopProgressFallback(){ clearInterval(progTimer); progTimer=null; progEstMs=0; }
function stopSpeak(){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  speaking=false; paused=false;
  stopProgressFallback();
  resetAudioProgress();
  updateSpeakUI();
}
function startSpeak(){
  if(!('speechSynthesis' in window)||idx===COVER) return;
  const s=STORIES[idx];
  const fullText = s.title+'. '+s.text.join(' ');
  speakLen = fullText.length || 1;
  const u=new SpeechSynthesisUtterance(fullText);
  u.lang='fr-FR';u.rate=0.85;u.pitch=1.05;      // débit ralenti, voix douce pour l'enfant
  const v=cachedFrVoice||pickFrVoice();if(v){u.voice=v;u.lang=v.lang;}
  // ~70 ms/caractère à ce débit : estimation grossière pour le secours temporel
  const estMs=Math.max(2000,fullText.length*70);
  u.onstart=()=>{ startProgressFallback(estMs); };
  u.onboundary=(e)=>{
    if(typeof e.charIndex==='number') setAudioProgress((e.charIndex/speakLen)*100);
  };
  u.onend=()=>{
    stopProgressFallback();
    setAudioProgress(100);   // flash de complétion avant de masquer la jauge
    paused=false;
    setTimeout(()=>{ speaking=false; resetAudioProgress(); updateSpeakUI(); },450);
  };
  u.onerror=()=>{speaking=false;paused=false;stopProgressFallback();resetAudioProgress();updateSpeakUI();};
  window.speechSynthesis.cancel();
  // Chrome avorte parfois un speak() lancé dans le même tick qu'un cancel() : on laisse un court délai
  setTimeout(()=>window.speechSynthesis.speak(u),50);
  speaking=true; paused=false;
  resetAudioProgress();
  updateSpeakUI();
}
function togglePause(){          // met en pause OU reprend là où on s'est arrêté
  if(!speaking) return;
  if(paused){ window.speechSynthesis.resume(); paused=false; resumeProgressFallback(); }
  else      { window.speechSynthesis.pause();  paused=true;  pauseProgressFallback(); }
  updateSpeakUI();
}
// certaines plateformes chargent la liste des voix de façon asynchrone
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=refreshFrVoice; refreshFrVoice(); }
let busy=false;
function turn(dir){
  if(busy) return;
  const target=idx+dir;
  if(target<COVER||target>total-1) return;
  busy=true;
  const cur=document.getElementById('page');
  cur.classList.add('flip-out');
  setTimeout(()=>{
    idx=target;
    render();
    const np=document.getElementById('page');
    np.classList.add('flip-in');
    let safety;
    const release=()=>{np.classList.remove('flip-in');busy=false;clearTimeout(safety);};
    np.addEventListener('animationend',release,{once:true});
    // sécurité si animationend ne se déclenche pas
    safety=setTimeout(release,500);
  },340);
}

prevBtn.onclick=()=>turn(-1);
nextBtn.onclick=()=>turn(1);
document.addEventListener('keydown',e=>{
  if(document.getElementById('menuView').classList.contains('show')) return;
  if(e.key==='ArrowRight') turn(1);
  if(e.key==='ArrowLeft') turn(-1);
});

// swipe
let sx=0, sy=0;
bookEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
bookEl.addEventListener('touchend',e=>{
  if(document.getElementById('menuView').classList.contains('show')) return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  // ignore les défilements verticaux (lecture du texte) qui ont un léger déplacement horizontal
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ if(dx<0) turn(1); else turn(-1); }
});

/* ===== SOMMAIRE ===== */
const menuBtn=document.getElementById('menuBtn');
const backBtn=document.getElementById('backBtn');
const menuView=document.getElementById('menuView');
const bookView=document.getElementById('bookView');
const menuList=document.getElementById('menuList');

function buildMenu(){
  const groups={hero:[],fun:[],manners:[],family:[]};
  STORIES.forEach((s,i)=>groups[s.cat].push({s,i}));
  let html='';
  for(const k of ['hero','fun','manners','family']){
    html+=`<h3><span class="pip" style="background:${CCOL[k]}"></span>${CICON[k]} ${C[k]} (${groups[k].length})</h3><div class="cards">`;
    groups[k].forEach(({s,i})=>{
      html+=`<div class="scard" role="button" tabindex="0" data-i="${i}">
        <span class="nn">N°${String(i+1).padStart(2,'0')}</span>
        <span class="tt">${s.title}</span></div>`;
    });
    html+='</div>';
  }
  menuList.innerHTML=html;
  menuList.querySelectorAll('.scard').forEach(c=>{
    const go=()=>{
      const n=parseInt(c.dataset.i,10);
      if(!Number.isInteger(n)||n<0||n>=total) return;
      idx=n;busy=false;closeMenu();render();
    };
    c.onclick=go;
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
}
function openMenu(){stopSpeak();busy=false;menuView.classList.add('show');bookView.style.display='none';buildMenu();}
function closeMenu(){menuView.classList.remove('show');bookView.style.display='flex';}
menuBtn.onclick=openMenu;
backBtn.onclick=closeMenu;

/* étoiles d'ambiance */
const starWrap=document.getElementById('stars');
for(let i=0;i<40;i++){
  const d=document.createElement('div');
  d.className='star-dot';
  const sz=Math.random()*2.4+1;
  d.style.width=d.style.height=sz+'px';
  d.style.left=Math.random()*100+'%';
  d.style.top=Math.random()*100+'%';
  d.style.animationDelay=(Math.random()*3)+'s';
  starWrap.appendChild(d);
}

render();
</script>
